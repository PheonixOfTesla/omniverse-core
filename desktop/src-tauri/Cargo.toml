[package]
name = "omniverse-desktop"
version = "1.0.0"
description = "Omniverse Desktop - Sovereign AI Consciousness"
authors = ["Omniverse Foundation"]
license = "MIT"
repository = "https://github.com/omniverse-ai/omniverse-core"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = ["shell-open", "dialog-all", "fs-all", "path-all", "process-all", "clipboard-all", "notification-all"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.35", features = ["full"] }
dirs = "5.0"
reqwest = { version = "0.12", features = ["json", "stream"] }
futures = "0.3"

# Piper ONNX TTS
rodio = { version = "0.19", default-features = false, features = ["wav"] }
lazy_static = "1.4"
base64 = "0.21"

# Link to omniverse core
omniverse = { path = "../../core" }

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# UUID generation
uuid = { version = "1.6", features = ["v4", "serde"] }

# Hex encoding for debugging
hex = "0.4"

# SQLCipher (for tests)
rusqlite = { version = "0.31", features = ["bundled-sqlcipher"] }

[dev-dependencies]
tempfile = "3.8"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true
