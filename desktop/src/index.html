<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Omniverse - Phoenix Edition</title>

    <!-- Phoenix Styles -->
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="phoenix-voice.css">
    <link rel="stylesheet" href="voice-mode.css">
    <link rel="stylesheet" href="widget-styles.css">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        /* Omniverse Setup Styles */
        .setup-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            transition: opacity 0.5s;
        }

        .setup-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .setup-logo {
            font-size: 64px;
            color: #00D9FF;
            text-shadow: 0 0 30px rgba(0, 217, 255, 1);
            letter-spacing: 12px;
            margin-bottom: 30px;
            animation: pulse 2s infinite;
        }

        .setup-form {
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }

        .input-group {
            margin-bottom: 16px;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 12px;
            color: rgba(0, 217, 255, 0.7);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .input-group input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(0, 10, 20, 0.9);
            border: 2px solid rgba(0, 217, 255, 0.3);
            border-radius: 8px;
            color: #00D9FF;
            font-size: 16px;
            font-family: inherit;
        }

        .input-group input:focus {
            outline: none;
            border-color: #00D9FF;
            box-shadow: 0 0 20px rgba(0, 217, 255, 0.5);
        }

        .btn-primary {
            width: 100%;
            padding: 14px 24px;
            background: rgba(0, 217, 255, 0.2);
            border: 2px solid #00D9FF;
            color: #00D9FF;
            font-family: inherit;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px;
            letter-spacing: 2px;
            transition: all 0.3s;
        }

        .btn-primary:hover {
            background: rgba(0, 217, 255, 0.3);
            box-shadow: 0 0 30px rgba(0, 217, 255, 0.6);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .setup-subtitle {
            color: rgba(0, 217, 255, 0.6);
            margin-bottom: 40px;
            max-width: 500px;
            line-height: 1.6;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body data-mode="voice" style="background: #000000 !important;">
    <!-- Setup Screen (shows on first run) -->
    <div id="setupScreen" class="setup-screen">
        <div class="setup-logo">OMNIVERSE</div>
        <p class="setup-subtitle">
            Your sovereign AI consciousness powered by Phoenix.<br>
            All data encrypted and stored locally on this device.
        </p>

        <form class="setup-form" id="setupForm">
            <div class="input-group">
                <label for="passphrase">Encryption Passphrase</label>
                <input type="password" id="passphrase" placeholder="Enter a strong passphrase" required autocomplete="new-password">
            </div>
            <div class="input-group">
                <label for="confirmPassphrase">Confirm Passphrase</label>
                <input type="password" id="confirmPassphrase" placeholder="Confirm your passphrase" required autocomplete="new-password">
            </div>
            <button type="submit" class="btn-primary" id="setupBtn">Initialize Omniverse</button>
        </form>
    </div>

    <!-- Loading Screen -->
    <div id="loading" style="position:fixed;top:0;left:0;width:100%;height:100%;background:#000;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity 1s">
        <div style="font-size:64px;color:#00D9FF;text-shadow:0 0 30px rgba(0, 217, 255,1);letter-spacing:12px;margin-bottom:30px;animation:pulse 2s infinite">PHOENIX</div>
        <div style="width:60px;height:60px;border:3px solid rgba(0, 217, 255,0.2);border-top-color:#00D9FF;border-radius:50%;animation:spin 1s linear infinite"></div>
        <div style="margin-top:30px;color:rgba(0, 217, 255,0.7);font-size:14px;letter-spacing:2px">INITIALIZING AI SYSTEMS...</div>
    </div>

    <!-- Phoenix UI Container (hidden until initialized) -->
    <div id="phoenixContainer" style="display: none;">
        <!-- Voice Mode Toggle -->
        <div id="mode-toggle-container" style="position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:10001;display:flex;gap:10px">
            <button id="voice-mode-btn" class="mode-toggle-btn mode-toggle-btn-active">
                VOICE
            </button>
            <button id="manual-mode-btn" class="mode-toggle-btn">
                MANUAL
            </button>
        </div>

        <!-- Greeting -->
        <div id="greeting" style="position:fixed;top:20%;left:50%;transform:translateX(-50%);text-align:center;z-index:500;opacity:0;animation:fadeIn 1s 1s forwards;pointer-events:none">
            <div class="greeting-main" style="font-size:36px;color:#00D9FF;margin-bottom:10px;text-shadow:0 0 20px rgba(0, 217, 255,1)">Welcome to Omniverse</div>
            <div class="greeting-sub" style="font-size:14px;color:rgba(0, 217, 255,0.6)">Local AI • Sovereign Data • Phoenix Powered</div>
        </div>

        <!-- Phoenix Orb Container -->
        <div id="phoenix-core-container" style="position:fixed;top:50%;left:50%;transform:translate(-50%, -50%);z-index:600">
            <!-- Phoenix orb will be injected here by phoenix-orb.js -->
        </div>

        <!-- Widget Container -->
        <div id="phoenix-widget-container"></div>

        <!-- Voice Controls -->
        <div class="voice-controls" style="position:fixed;bottom:24px;right:24px;z-index:9999;display:flex;flex-direction:column;gap:12px;align-items:flex-end">
            <div class="voice-status idle" id="voiceStatus">Offline</div>
            <button class="voice-btn" id="voiceBtn" disabled>
                <i class="fas fa-microphone"></i>
                <span>Activate Voice</span>
            </button>
            <select class="voice-selector" id="voiceSelector">
                <option value="nova">Phoenix (Nova)</option>
                <option value="alloy">Alloy</option>
                <option value="echo">Echo</option>
                <option value="fable">Fable</option>
                <option value="onyx">Onyx</option>
                <option value="shimmer">Shimmer</option>
            </select>
        </div>

        <!-- System Status (Bottom Left) -->
        <div id="hud-bl" style="position:fixed;bottom:20px;left:20px;z-index:1000;padding:15px;background:rgba(0,10,20,0.9);border:1px solid rgba(0, 217, 255,0.3);backdrop-filter:blur(10px);border-radius:8px;min-width:200px">
            <div style="font-size:9px;color:rgba(0, 217, 255,0.5);letter-spacing:1px">SYSTEM STATUS</div>
            <div id="status-display" style="font-size:13px;color:#00D9FF;font-weight:bold;margin:5px 0;display:flex;align-items:center;gap:8px">
                <span style="width:8px;height:8px;background:#00D9FF;border-radius:50%;box-shadow:0 0 10px #00D9FF;animation:pulse 2s infinite"></span>
                ONLINE
            </div>
            <div style="margin-top:12px;padding-top:12px;border-top:1px solid rgba(0, 217, 255,0.2)">
                <div style="font-size:9px;color:rgba(0, 217, 255,0.5);letter-spacing:1px;margin-bottom:8px">MODE</div>
                <div id="backend-mode" style="font-size:11px;color:#00D9FF;font-family:monospace">LOCAL</div>
            </div>
        </div>

        <!-- Genesis Hash (Bottom Right) -->
        <div style="position:fixed;bottom:20px;right:240px;z-index:1000;padding:12px 16px;background:rgba(0,10,20,0.9);border:1px solid rgba(0, 217, 255,0.3);backdrop-filter:blur(10px);border-radius:8px;font-size:10px;color:rgba(0, 217, 255,0.7);font-family:monospace">
            <span style="opacity:0.5">GENESIS:</span> <span id="genesisHash">...</span>
        </div>
    </div>

    <!-- Scripts -->
    <script src="api-adapter.js"></script>
    <script src="config.js"></script>

    <script>
        // Auto-hide greeting after 5 seconds
        setTimeout(() => {
            const greeting = document.getElementById('greeting');
            if (greeting) {
                greeting.style.transition = 'opacity 1s ease-out';
                greeting.style.opacity = '0';
            }
        }, 6000);

        // Setup form handler
        document.getElementById('setupForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const passphrase = document.getElementById('passphrase').value;
            const confirmPassphrase = document.getElementById('confirmPassphrase').value;
            const setupBtn = document.getElementById('setupBtn');

            if (passphrase !== confirmPassphrase) {
                alert('Passphrases do not match');
                return;
            }

            if (passphrase.length < 8) {
                alert('Passphrase must be at least 8 characters');
                return;
            }

            setupBtn.disabled = true;
            setupBtn.textContent = 'Initializing...';

            try {
                // Initialize Omniverse via Tauri
                if (window.__TAURI__) {
                    const { invoke } = window.__TAURI__.tauri;
                    const result = await invoke('initialize', { passphrase });

                    if (result && result.success) {
                        // Store genesis hash
                        const genesisHash = result.genesis_hash;
                        document.getElementById('genesisHash').textContent = genesisHash.substring(0, 12) + '...';

                        // Hide setup, show loading
                        document.getElementById('setupScreen').classList.add('hidden');
                        document.getElementById('loading').style.display = 'flex';

                        // Initialize Phoenix UI
                        setTimeout(() => {
                            initializePhoenix();
                        }, 2000);
                    } else {
                        throw new Error(result?.message || 'Initialization failed');
                    }
                } else {
                    // Browser mode - skip Tauri init
                    document.getElementById('setupScreen').classList.add('hidden');
                    document.getElementById('loading').style.display = 'flex';

                    setTimeout(() => {
                        initializePhoenix();
                    }, 2000);
                }
            } catch (error) {
                console.error('Setup error:', error);
                alert('Error: ' + error.message);
                setupBtn.disabled = false;
                setupBtn.textContent = 'Initialize Omniverse';
            }
        });

        // Check if already initialized
        async function checkInitialized() {
            try {
                if (window.__TAURI__) {
                    const { invoke } = window.__TAURI__.tauri;
                    const health = await invoke('health');

                    if (health && health.initialized) {
                        // Already initialized - skip setup
                        document.getElementById('setupScreen').classList.add('hidden');
                        document.getElementById('loading').style.display = 'flex';

                        if (health.genesis_hash) {
                            document.getElementById('genesisHash').textContent =
                                health.genesis_hash.substring(0, 12) + '...';
                        }

                        setTimeout(() => {
                            initializePhoenix();
                        }, 1000);

                        return true;
                    }
                }
            } catch (error) {
                console.log('Not initialized yet:', error);
            }
            return false;
        }

        // Initialize Phoenix UI
        function initializePhoenix() {
            // Hide loading
            document.getElementById('loading').style.display = 'none';

            // Show Phoenix container
            document.getElementById('phoenixContainer').style.display = 'block';

            // Update backend mode indicator
            const backendMode = document.getElementById('backend-mode');
            if (window.__TAURI__) {
                backendMode.textContent = 'LOCAL (Tauri)';
            } else {
                backendMode.textContent = 'CLOUD';
            }

            // Load Phoenix modules
            loadPhoenixModules();
        }

        // Load Phoenix JavaScript modules
        function loadPhoenixModules() {
            const scripts = [
                'phoenix-orb.js',
                'widget-manager.js',
                'voice-controller.js',
                'phoenix-voice-commands.js',
                'orchestrator.js',
                'jarvis.js'
            ];

            let loaded = 0;

            scripts.forEach(src => {
                const script = document.createElement('script');
                script.src = src;
                script.onload = () => {
                    loaded++;
                    console.log(`[Omniverse] Loaded: ${src} (${loaded}/${scripts.length})`);

                    if (loaded === scripts.length) {
                        console.log('[Omniverse] All Phoenix modules loaded');
                        // Initialize voice button
                        const voiceBtn = document.getElementById('voiceBtn');
                        const voiceStatus = document.getElementById('voiceStatus');
                        if (voiceBtn) {
                            voiceBtn.disabled = false;
                            voiceStatus.textContent = 'Ready';
                            voiceStatus.classList.remove('idle');
                        }
                    }
                };
                script.onerror = () => {
                    console.error(`[Omniverse] Failed to load: ${src}`);
                };
                document.head.appendChild(script);
            });
        }

        // Mode toggle functions
        function switchToVoiceMode() {
            document.body.setAttribute('data-mode', 'voice');
            document.getElementById('voice-mode-btn').classList.add('mode-toggle-btn-active');
            document.getElementById('manual-mode-btn').classList.remove('mode-toggle-btn-active');
            localStorage.setItem('omniverse_ui_mode', 'voice');
        }

        function switchToManualMode() {
            document.body.setAttribute('data-mode', 'manual');
            document.getElementById('manual-mode-btn').classList.add('mode-toggle-btn-active');
            document.getElementById('voice-mode-btn').classList.remove('mode-toggle-btn-active');
            localStorage.setItem('omniverse_ui_mode', 'manual');
        }

        // Attach mode toggle handlers
        document.getElementById('voice-mode-btn')?.addEventListener('click', switchToVoiceMode);
        document.getElementById('manual-mode-btn')?.addEventListener('click', switchToManualMode);

        // Check initialization on load
        window.addEventListener('DOMContentLoaded', () => {
            checkInitialized();
        });
    </script>
</body>
</html>
