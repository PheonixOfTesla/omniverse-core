<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omniverse</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --cyan: #00D9FF;
            --cyan-dim: rgba(0, 217, 255, 0.6);
            --cyan-glow: rgba(0, 217, 255, 0.3);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
            background: #000;
            color: var(--cyan);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            text-align: center;
            padding: 60px;
            max-width: 500px;
        }

        .logo {
            font-size: 48px;
            letter-spacing: 12px;
            font-weight: 200;
            margin-bottom: 20px;
            text-shadow: 0 0 40px var(--cyan);
        }

        .tagline {
            font-size: 14px;
            color: var(--cyan-dim);
            margin-bottom: 60px;
            letter-spacing: 3px;
        }

        .vault-box {
            background: rgba(0, 20, 40, 0.6);
            border: 2px solid var(--cyan-glow);
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 0 60px var(--cyan-glow);
        }

        .vault-title {
            font-size: 13px;
            letter-spacing: 4px;
            margin-bottom: 30px;
            color: var(--cyan-dim);
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-size: 11px;
            letter-spacing: 2px;
            margin-bottom: 10px;
            color: var(--cyan-dim);
            text-align: left;
        }

        .input-group input {
            width: 100%;
            padding: 16px 20px;
            background: rgba(0, 217, 255, 0.05);
            border: 1px solid var(--cyan-glow);
            border-radius: 8px;
            color: var(--cyan);
            font-size: 16px;
            outline: none;
            transition: all 0.3s;
        }

        .input-group input:focus {
            border-color: var(--cyan);
            box-shadow: 0 0 20px var(--cyan-glow);
        }

        .input-group input::placeholder {
            color: rgba(0, 217, 255, 0.3);
        }

        .btn {
            width: 100%;
            padding: 18px;
            background: rgba(0, 217, 255, 0.1);
            border: 2px solid var(--cyan);
            border-radius: 8px;
            color: var(--cyan);
            font-size: 14px;
            letter-spacing: 3px;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .btn:hover {
            background: rgba(0, 217, 255, 0.2);
            box-shadow: 0 0 30px var(--cyan-glow);
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .error {
            color: #ff4444;
            font-size: 12px;
            margin-top: 15px;
            display: none;
        }

        .footer {
            margin-top: 40px;
            font-size: 11px;
            color: rgba(0, 217, 255, 0.3);
        }

        .footer svg {
            width: 12px;
            height: 12px;
            vertical-align: middle;
            margin-right: 4px;
        }

        .switch-mode {
            margin-top: 20px;
        }

        .switch-mode button {
            background: none;
            border: none;
            color: var(--cyan-dim);
            font-size: 12px;
            cursor: pointer;
            text-decoration: underline;
        }

        .switch-mode button:hover {
            color: var(--cyan);
        }

        /* Create mode specific */
        .confirm-group {
            display: none;
        }

        .create-mode .confirm-group {
            display: block;
        }

        .create-mode .unlock-hint {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">OMNIVERSE</div>
        <div class="tagline">SOVEREIGN AI CONSCIOUSNESS</div>

        <div class="vault-box" id="vault-box">
            <div class="vault-title">VAULT</div>

            <form id="vault-form" onsubmit="handleSubmit(event)">
                <div class="input-group">
                    <label>PASSPHRASE</label>
                    <input type="password" id="passphrase" placeholder="Enter passphrase" required autocomplete="current-password">
                </div>

                <div class="input-group confirm-group">
                    <label>CONFIRM PASSPHRASE</label>
                    <input type="password" id="confirm-passphrase" placeholder="Confirm passphrase" autocomplete="new-password">
                </div>

                <button type="submit" class="btn" id="submit-btn">UNLOCK VAULT</button>

                <div class="error" id="error"></div>
            </form>

            <div class="switch-mode">
                <button type="button" id="switch-btn" onclick="toggleMode()">Create new vault</button>
            </div>

            <div class="footer">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="11" width="18" height="11" rx="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
                100% offline &bull; Nothing leaves this device
            </div>
        </div>
    </div>

    <script>
        let isCreateMode = false;

        function toggleMode() {
            isCreateMode = !isCreateMode;
            const box = document.getElementById('vault-box');
            const btn = document.getElementById('submit-btn');
            const switchBtn = document.getElementById('switch-btn');

            if (isCreateMode) {
                box.classList.add('create-mode');
                btn.textContent = 'CREATE VAULT';
                switchBtn.textContent = 'Already have a vault? Unlock';
            } else {
                box.classList.remove('create-mode');
                btn.textContent = 'UNLOCK VAULT';
                switchBtn.textContent = 'Create new vault';
            }

            document.getElementById('error').style.display = 'none';
        }

        async function handleSubmit(e) {
            e.preventDefault();

            const passphrase = document.getElementById('passphrase').value;
            const confirm = document.getElementById('confirm-passphrase').value;
            const errorEl = document.getElementById('error');
            const btn = document.getElementById('submit-btn');

            errorEl.style.display = 'none';

            // Validation
            if (passphrase.length < 8) {
                errorEl.textContent = 'Passphrase must be at least 8 characters';
                errorEl.style.display = 'block';
                return;
            }

            if (isCreateMode && passphrase !== confirm) {
                errorEl.textContent = 'Passphrases do not match';
                errorEl.style.display = 'block';
                return;
            }

            btn.disabled = true;
            btn.textContent = isCreateMode ? 'CREATING...' : 'UNLOCKING...';

            try {
                if (window.__TAURI__) {
                    const { invoke } = window.__TAURI__.tauri;
                    const command = isCreateMode ? 'initialize' : 'unlock';
                    const result = await invoke(command, { passphrase });

                    if (result && result.success) {
                        localStorage.setItem('vaultUnlocked', 'true');
                        if (result.genesis_hash) {
                            localStorage.setItem('genesisHash', result.genesis_hash);
                        }
                        window.location.href = 'dashboard.html';
                    } else {
                        throw new Error(result?.message || 'Operation failed');
                    }
                } else {
                    // Not in Tauri - demo mode
                    localStorage.setItem('vaultUnlocked', 'true');
                    window.location.href = 'dashboard.html';
                }
            } catch (error) {
                console.error('Vault error:', error);
                errorEl.textContent = error.toString().includes('incorrect')
                    ? 'Incorrect passphrase'
                    : 'Error: ' + error;
                errorEl.style.display = 'block';
                btn.disabled = false;
                btn.textContent = isCreateMode ? 'CREATE VAULT' : 'UNLOCK VAULT';
            }
        }

        // Check if vault already unlocked
        document.addEventListener('DOMContentLoaded', async () => {
            if (localStorage.getItem('vaultUnlocked') === 'true') {
                window.location.href = 'dashboard.html';
                return;
            }

            // Check if vault exists to auto-select mode
            if (window.__TAURI__) {
                try {
                    const { invoke } = window.__TAURI__.tauri;
                    const status = await invoke('check_initialized');
                    if (!status.initialized) {
                        toggleMode(); // Switch to create mode
                    }
                } catch (e) {
                    console.log('Could not check vault status');
                }
            }
        });
    </script>
</body>
</html>
