<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omniverse</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --cyan: #00D9FF;
            --cyan-dim: rgba(0, 217, 255, 0.6);
            --cyan-glow: rgba(0, 217, 255, 0.3);
            --bg: #000;
            --bg-card: rgba(0, 20, 40, 0.8);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
            background: var(--bg);
            color: var(--cyan);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--cyan-glow);
        }

        .logo {
            font-size: 24px;
            letter-spacing: 8px;
            font-weight: 300;
            text-shadow: 0 0 20px var(--cyan);
        }

        .status {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
            color: var(--cyan-dim);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #00ff88;
            border-radius: 50%;
            box-shadow: 0 0 10px #00ff88;
        }

        /* Main content */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        /* Voice orb */
        .orb-container {
            margin-bottom: 40px;
        }

        .orb {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, var(--cyan-glow), transparent);
            border: 2px solid var(--cyan);
            box-shadow: 0 0 40px var(--cyan-glow), inset 0 0 30px var(--cyan-glow);
            animation: pulse 3s ease-in-out infinite;
            cursor: pointer;
            transition: all 0.3s;
        }

        .orb:hover {
            transform: scale(1.05);
            box-shadow: 0 0 60px var(--cyan-glow), inset 0 0 40px var(--cyan-glow);
        }

        .orb.listening {
            animation: listening 0.5s ease-in-out infinite;
            border-color: #00ff88;
            box-shadow: 0 0 60px rgba(0, 255, 136, 0.5);
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 40px var(--cyan-glow), inset 0 0 30px var(--cyan-glow); }
            50% { box-shadow: 0 0 60px var(--cyan-glow), inset 0 0 50px var(--cyan-glow); }
        }

        @keyframes listening {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        /* Status text */
        .voice-status {
            font-size: 14px;
            color: var(--cyan-dim);
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .voice-hint {
            font-size: 12px;
            color: rgba(0, 217, 255, 0.4);
        }

        /* Chat area */
        .chat-container {
            width: 100%;
            max-width: 600px;
            margin-top: 40px;
        }

        .messages {
            max-height: 300px;
            overflow-y: auto;
            padding: 20px;
            background: var(--bg-card);
            border: 1px solid var(--cyan-glow);
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .message {
            padding: 12px 16px;
            margin-bottom: 12px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.6;
        }

        .message.user {
            background: rgba(0, 217, 255, 0.1);
            border: 1px solid var(--cyan-glow);
            margin-left: 40px;
        }

        .message.ai {
            background: rgba(0, 255, 136, 0.05);
            border: 1px solid rgba(0, 255, 136, 0.2);
            margin-right: 40px;
            color: #00ff88;
        }

        /* Input */
        .input-container {
            display: flex;
            gap: 10px;
        }

        .input-container input {
            flex: 1;
            padding: 14px 20px;
            background: var(--bg-card);
            border: 1px solid var(--cyan-glow);
            border-radius: 8px;
            color: var(--cyan);
            font-size: 14px;
            outline: none;
            transition: all 0.3s;
        }

        .input-container input:focus {
            border-color: var(--cyan);
            box-shadow: 0 0 20px var(--cyan-glow);
        }

        .input-container input::placeholder {
            color: var(--cyan-dim);
        }

        .input-container button {
            padding: 14px 24px;
            background: rgba(0, 217, 255, 0.1);
            border: 1px solid var(--cyan);
            border-radius: 8px;
            color: var(--cyan);
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .input-container button:hover {
            background: rgba(0, 217, 255, 0.2);
            box-shadow: 0 0 20px var(--cyan-glow);
        }

        /* Footer */
        .footer {
            padding: 20px;
            text-align: center;
            font-size: 11px;
            color: rgba(0, 217, 255, 0.3);
            border-top: 1px solid var(--cyan-glow);
        }

        .footer svg {
            width: 14px;
            height: 14px;
            vertical-align: middle;
            margin-right: 6px;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">OMNIVERSE</div>
        <div class="status">
            <span class="status-dot"></span>
            <span id="vault-status">Vault Unlocked</span>
        </div>
    </header>

    <main class="main">
        <div class="orb-container">
            <div class="orb" id="voice-orb" onclick="toggleListening()"></div>
        </div>
        <div class="voice-status" id="voice-status">Ready</div>
        <div class="voice-hint">Click orb or say "Hey Omniverse"</div>

        <div class="chat-container">
            <div class="messages" id="messages">
                <div class="message ai">Welcome to Omniverse. Your sovereign AI companion. All data stays on this device, encrypted.</div>
            </div>
            <div class="input-container">
                <input type="text" id="user-input" placeholder="Type your message..." onkeypress="handleKeyPress(event)">
                <button onclick="sendMessage()">Send</button>
            </div>
        </div>
    </main>

    <footer class="footer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
        100% Local &bull; Encrypted &bull; Sovereign
    </footer>

    <script>
        // State
        let isListening = false;

        // Toggle listening
        function toggleListening() {
            const orb = document.getElementById('voice-orb');
            const status = document.getElementById('voice-status');

            isListening = !isListening;

            if (isListening) {
                orb.classList.add('listening');
                status.textContent = 'Listening...';
                // Start speech recognition if available
                startListening();
            } else {
                orb.classList.remove('listening');
                status.textContent = 'Ready';
                stopListening();
            }
        }

        // Send message
        async function sendMessage() {
            const input = document.getElementById('user-input');
            const message = input.value.trim();

            if (!message) return;

            // Add user message
            addMessage(message, 'user');
            input.value = '';

            // Process with AI
            const response = await processWithAI(message);
            addMessage(response, 'ai');
        }

        // Add message to chat
        function addMessage(text, type) {
            const messages = document.getElementById('messages');
            const div = document.createElement('div');
            div.className = `message ${type}`;
            div.textContent = text;
            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
        }

        // Handle enter key
        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        // Process with local AI (Ollama via Tauri)
        async function processWithAI(message) {
            try {
                if (window.__TAURI__) {
                    const { invoke } = window.__TAURI__.tauri;
                    const response = await invoke('chat', { message });
                    return response.text || response;
                } else {
                    return "AI processing requires the Omniverse desktop app with local Ollama.";
                }
            } catch (error) {
                console.error('AI Error:', error);
                return "I'm having trouble processing that. Make sure Ollama is running locally.";
            }
        }

        // Speech recognition
        let recognition = null;

        function startListening() {
            if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                recognition = new SpeechRecognition();
                recognition.continuous = false;
                recognition.interimResults = false;

                recognition.onresult = (event) => {
                    const text = event.results[0][0].transcript;
                    document.getElementById('user-input').value = text;
                    sendMessage();
                };

                recognition.onend = () => {
                    document.getElementById('voice-orb').classList.remove('listening');
                    document.getElementById('voice-status').textContent = 'Ready';
                    isListening = false;
                };

                recognition.start();
            } else {
                document.getElementById('voice-status').textContent = 'Voice not supported in Tauri';
            }
        }

        function stopListening() {
            if (recognition) {
                recognition.stop();
            }
        }

        // Store/retrieve from encrypted vault
        async function saveToVault(key, data) {
            if (window.__TAURI__) {
                const { invoke } = window.__TAURI__.tauri;
                await invoke('store_data', { key, data: JSON.stringify(data) });
            }
        }

        async function loadFromVault(key) {
            if (window.__TAURI__) {
                const { invoke } = window.__TAURI__.tauri;
                const data = await invoke('get_data', { key });
                return data ? JSON.parse(data) : null;
            }
            return null;
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            console.log('[Omniverse] Sovereign mode initialized');
            console.log('[Omniverse] All data encrypted locally');
        });
    </script>
</body>
</html>
